<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afterimage Hall</title>
  <meta name="description" content="A walkable gallery of original motion paintings, rendered in real time.">
  <style>
    :root {
      --paper: #ebe6dd;
      --ink: #1c1a17;
      --muted: #6d665c;
      --ember: #e6793f;
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --paper: #15130f; --ink: #efe9df; --muted: #a39b8f; }
    }
    :root[data-theme="dark"] { --paper: #15130f; --ink: #efe9df; --muted: #a39b8f; }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .masthead {
      position: fixed; top: 20px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      pointer-events: none; font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    }
    .masthead strong { font-family: var(--serif); font-size: 20px; letter-spacing: 0; text-transform: none; font-weight: 500; }
    .plate-panel {
      position: fixed; left: 24px; bottom: 24px; width: min(360px, calc(100vw - 48px));
      padding: 22px 22px 20px; border-radius: 18px;
      background: color-mix(in srgb, var(--paper) 86%, transparent);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .14);
      opacity: 0; transform: translateY(12px);
      transition: opacity .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1);
      pointer-events: none;
    }
    .plate-panel.is-open { opacity: 1; transform: none; pointer-events: auto; }
    .plate-panel .series { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); margin: 0 0 8px; }
    .plate-panel h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.05; margin: 0 0 10px; }
    .plate-panel p { font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0 0 6px; }
    .plate-panel dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0 0; font-family: var(--sans); font-size: 12px; }
    .plate-panel dt { color: var(--muted); }
    .plate-panel dd { margin: 0; }
    .plate-panel button {
      position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); background: transparent; color: var(--ink);
      cursor: pointer; font-size: 16px; line-height: 1;
      transition: transform .25s cubic-bezier(.2,.7,.2,1), background .25s;
    }
    .plate-panel button:hover { transform: scale(1.08); background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .plate-panel button:focus-visible, .skip:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
    .hint { position: fixed; right: 24px; bottom: 24px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: right; pointer-events: none; }
    .skip { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); font-family: var(--sans); font-size: 12px; }
    @media (max-width: 600px) {
      .plate-panel { left: 16px; right: 16px; bottom: 16px; width: auto; }
      .hint { display: none; }
      .masthead strong { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plate-panel { transition: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <a class="skip" href="#plate-panel">Skip to plate details</a>
  <canvas id="scene" aria-label="3D gallery with three motion paintings and a mirrored sculpture"></canvas>
  <header class="masthead">
    <strong>Afterimage Hall</strong>
    <span>Three plates · one sculpture</span>
  </header>
  <aside id="plate-panel" class="plate-panel" role="dialog" aria-live="polite" aria-labelledby="plate-title" aria-hidden="true">
    <button type="button" id="plate-close" aria-label="Close plate details">×</button>
    <p class="series" id="plate-series"></p>
    <h2 id="plate-title"></h2>
    <p id="plate-note"></p>
    <dl>
      <dt>Medium</dt><dd id="plate-medium"></dd>
      <dt>Year</dt><dd id="plate-year"></dd>
    </dl>
  </aside>
  <p class="hint">Click a plate · Esc to close · Drag to look around</p>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
