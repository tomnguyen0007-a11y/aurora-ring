<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Afterimage Hall</title>
  <meta name="description" content="A walkable gallery of original motion paintings and sculptures, rendered in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <style>
    /* Layout: the 3D room fills the screen. On desktop the details dock to the right and
       the camera shifts left to keep the work in view. On phones they become a bottom sheet. */
    :root {
      --ground: #0f1114;
      --glass: rgba(18, 20, 24, 0.88);
      --glass-edge: rgba(255, 255, 255, 0.10);
      --ink: #f3f0e9;
      --muted: #a9a69d;
      --brass: #c9a56a;
      --brass-ink: #1a1408;
      --serif: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      --sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
      --gutter: max(16px, env(safe-area-inset-left, 0px));
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); overflow: hidden; font-family: var(--sans); }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, .30) 100%);
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

    .topbar {
      position: fixed; z-index: 3; top: max(18px, env(safe-area-inset-top, 0px)); left: var(--gutter);
      right: max(16px, env(safe-area-inset-right, 0px));
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px; pointer-events: none;
      text-shadow: 0 1px 14px rgba(0, 0, 0, .45);
    }
    .brand { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: .01em; color: #fff; }
    .tagline { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 255, 255, .85); }

    /* Details panel */
    .panel {
      position: fixed; z-index: 3; top: 76px; right: max(24px, env(safe-area-inset-right, 0px)); bottom: 104px;
      width: min(380px, calc(100vw - 48px)); box-sizing: border-box; overflow-y: auto;
      padding: 28px 28px 24px; border-radius: 20px; background: var(--glass);
      border: 1px solid var(--glass-edge); box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      display: flex; flex-direction: column; gap: 14px;
      opacity: 0; transform: translateX(16px); pointer-events: none; visibility: hidden;
      transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s .45s;
    }
    .panel.is-open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
    .eyebrow { display: flex; gap: 10px; margin: 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
    .eyebrow span + span::before { content: "\00b7"; margin-right: 10px; color: var(--muted); }
    .panel h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 42px; line-height: 1.02; letter-spacing: -.005em; text-wrap: balance; }
    .after { margin: 0; font-size: 13px; color: var(--muted); }
    .after em { font-family: var(--serif); font-size: 17px; font-style: italic; color: var(--ink); }
    .note { margin: 0; font-size: 15px; line-height: 1.6; color: #d8d5cc; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0; padding-top: 14px; border-top: 1px solid var(--glass-edge); }
    .meta div { min-width: 0; }
    .meta dt { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .meta dd { margin: 0; font-size: 13px; line-height: 1.4; }
    .cta {
      margin-top: auto; padding: 14px 18px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--brass); color: var(--brass-ink); font-weight: 600; font-size: 14px; letter-spacing: .02em;
      transition: transform .25s var(--ease), filter .25s;
    }
    .cta:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .keys { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
    .panel-close {
      position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--glass-edge); background: transparent; cursor: pointer; font-size: 17px; line-height: 1;
      transition: background .25s, transform .25s var(--ease);
    }
    .panel-close:hover { background: rgba(255, 255, 255, .08); transform: scale(1.06); }

    /* Dock: browse, overview, tour, music */
    .dock {
      position: fixed; z-index: 4; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 999px; background: var(--glass);
      border: 1px solid var(--glass-edge); box-shadow: 0 16px 40px rgba(0, 0, 0, .32);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    }
    .dock-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; min-width: 44px;
      padding: 0 14px; border: 0; border-radius: 999px; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; letter-spacing: .02em; white-space: nowrap;
      transition: background .25s, transform .25s var(--ease);
    }
    .dock-btn:hover { background: rgba(255, 255, 255, .09); }
    .dock-btn:active { transform: scale(.96); }
    .dock-btn[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
    .dock-btn:disabled { opacity: .5; cursor: default; }
    .dock-btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .dock-btn.arrow { padding: 0; width: 44px; }
    .dock-count { min-width: 64px; text-align: center; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
    .dock-sep { width: 1px; height: 24px; margin: 0 4px; background: var(--glass-edge); }
    #tour-toggle .ico-pause, #tour-toggle[aria-pressed="true"] .ico-play { display: none; }
    #tour-toggle[aria-pressed="true"] .ico-pause { display: block; }

    .toast {
      position: fixed; z-index: 5; left: 50%; bottom: 96px; transform: translate(-50%, 12px); max-width: min(440px, calc(100vw - 32px));
      padding: 12px 18px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-edge);
      font-size: 13px; line-height: 1.45; opacity: 0; pointer-events: none;
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    .toast.is-shown { opacity: 1; transform: translate(-50%, 0); }

    /* Phones: the details become a bottom sheet above a full-width dock, and the arrows grow. */
    @media (max-width: 720px) {
      .brand { font-size: 22px; }
      .tagline { display: none; }
      .dock { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); transform: none; justify-content: space-between; bottom: max(12px, env(safe-area-inset-bottom, 0px)); gap: 2px; padding: 6px; }
      .dock-btn .lbl, .dock-sep { display: none; }
      .dock-btn { padding: 0; width: 46px; height: 46px; }
      .dock-count { min-width: 0; flex: 1; font-size: 11px; letter-spacing: .04em; }
      .panel {
        top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
        bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 66px); width: auto; max-height: 44vh;
        padding: 20px 20px 18px; gap: 10px; transform: translateY(16px);
      }
      .panel h2 { font-size: 32px; }
      .note { font-size: 14px; line-height: 1.5; }
      .keys { display: none; }
      .toast { bottom: 90px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel, .toast, .cta, .dock-btn { transition: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D gallery with eleven motion paintings and six sculptures"></canvas>
  <header class="topbar">
    <span class="brand">Afterimage Hall</span>
    <span class="tagline">Eleven paintings &middot; six sculptures</span>
  </header>
  <aside id="plate-panel" class="panel" role="dialog" aria-live="polite" aria-labelledby="plate-title" aria-hidden="true">
    <button type="button" id="plate-close" class="panel-close" aria-label="Close details">&times;</button>
    <p class="eyebrow"><span id="plate-count"></span><span id="plate-series"></span></p>
    <h2 id="plate-title"></h2>
    <p class="after">Inspired by <em id="plate-after"></em></p>
    <p id="plate-note" class="note"></p>
    <dl class="meta">
      <div><dt>Medium</dt><dd id="plate-medium"></dd></div>
      <div><dt>Made</dt><dd id="plate-year"></dd></div>
    </dl>
    <button type="button" id="enquire" class="cta">Enquire about this work</button>
    <p class="keys">Use the arrow keys to browse</p>
  </aside>
  <nav class="dock" aria-label="Gallery controls">
    <button type="button" id="prev-work" class="dock-btn arrow" aria-label="Previous work"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="dock-count" class="dock-count">Overview</span>
    <button type="button" id="next-work" class="dock-btn arrow" aria-label="Next work"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="dock-sep"></span>
    <button type="button" id="overview" class="dock-btn" aria-label="Back to the overview"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg><span class="lbl">Overview</span></button>
    <button type="button" id="tour-toggle" class="dock-btn" aria-pressed="false" aria-label="Play or pause the tour"><svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><svg class="ico-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span class="lbl">Play tour</span></button>
    <button type="button" id="music-toggle" class="dock-btn" aria-pressed="false" aria-label="Turn music on or off"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span class="lbl">Music off</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
